<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Rayuela School</title>
  <script src="js/paths.js"></script>
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="login-root" class="login-page">
    <form class="login-card" id="login-form">
      <img class="login-logo" src="assets/logo.png" alt="La Rayuela School" />
      <h1>Portal familiar</h1>
      <p class="lead">Entra como tutor o padre de familia</p>
      <div id="login-error" class="login-error hidden"></div>
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="tu@correo.com" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="button" class="eye-btn" data-eye="password" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      <div class="demo-box">
        <strong>Cuentas de demostración</strong><br />
        Padre: padre@rayuela.edu / padre123
        <button type="button" data-fill="padre@rayuela.edu">usar</button><br />
        Tutora: tutor@rayuela.edu / tutor123
        <button type="button" data-fill="tutor@rayuela.edu">usar</button><br />
        Admin: admin@rayuela.edu / admin123
        <button type="button" data-fill="admin@rayuela.edu">usar</button>
      </div>
    </form>
    <form class="login-card hidden" id="change-form">
      <img class="login-logo" src="assets/logo.png" alt="La Rayuela School" />
      <h1>Cambia tu contraseña</h1>
      <p class="lead">La primera vez, o si administración te registró, debes elegir una nueva.</p>
      <div id="change-error" class="login-error hidden"></div>
      <div class="field">
        <label for="new-pass">Nueva contraseña</label>
        <div class="password-wrap">
          <input id="new-pass" name="password" type="password" minlength="6" required />
          <button type="button" class="eye-btn" data-eye="new-pass" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="new-pass2">Confirmar</label>
        <div class="password-wrap">
          <input id="new-pass2" type="password" minlength="6" required />
          <button type="button" class="eye-btn" data-eye="new-pass2" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Guardar y entrar</button>
    </form>
  </div>

  <div id="app-root" class="app-shell hidden">
    <header class="topbar" id="topbar"></header>
    <div class="app-body">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main"></main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="modal-root"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
